name: Feature request
description: Suggest an improvement to SirenX.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing an idea. Please do not include passwords, tokens, server credentials, private URLs, or other sensitive information.
  - type: textarea
    id: feature-description
    attributes:
      label: Feature description
      description: What would you like SirenX to do?
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: Describe the listening or library-management situation this would help with.
    validations:
      required: true
  - type: textarea
    id: usefulness
    attributes:
      label: Why this would be useful
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Include any mockups, examples, or context that could help explain the request.
